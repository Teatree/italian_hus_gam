services:
  - type: web
    name: italian-guess-the-house
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    # No rewrite to /index.html: the game lives at "/" only (a past day is "/?day=..."), so an
    # address that does not exist should answer 404 instead of a copy of the home page.
    headers:
      # Vite puts a content hash in every file name under /assets, so they can be cached for good.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
